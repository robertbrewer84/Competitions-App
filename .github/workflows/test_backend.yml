on:
  [push]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: Competitions-App
          environment-file: back-end/environment.yaml
          auto-activate-base: false
      - name: Backend Tests
        run: |
          flake8 --ignore=E501 app
          cd app
          python -m pytest --doctest-modules --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html
